<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andaman X(55)</title><style>body{margin:0;font-family:sans-serif;background:#8EB9E8;height:100vh;display:flex;flex-direction:column}header{background:#8EB9E8;padding:12px;display:flex;align-items:center;gap:10px;font-weight:bold;font-size:20px}header span{flex:1}#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}#chat div{background:#fff;padding:10px 14px;border-radius:14px;align-self:flex-end;max-width:80%;box-shadow:0 1px 3px #0002}#chat small{color:#666;font-size:11px;display:block;text-align:right}.bar{background:#fff;padding:10px;display:flex;gap:8px;align-items:center}input{flex:1;padding:12px;border-radius:20px;border:0;background:#F2F2F2;font-size:16px;outline:none}.send{font-size:28px;color:#3B82F6}#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;display:none;z-index:99}</style></head><body><div id="toast"></div><header><span>← Andaman X(55)</span><span style="flex:0">🔍 📞 📅 ☰</span></header><div id="chat"></div><div class="bar"><span>›</span><input id="t" value="รับ" placeholder="พิมพ์ข้อความ..."><span>😊</span><span class="send">➤</span></div><script>let a=JSON.parse(localStorage.getItem('chat')||'[]');if(a.length==0){a=[{t:'สวัสดีครับ',me:false},{t:'รับทราบครับ',me:true}];}function show(m){let d=document.createElement('div');d.innerHTML=m.t+'<small>'+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+'</small>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}function render(){chat.innerHTML='';a.forEach(show);}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1200);}function send(){if(!t.value.trim()){toast('พิมพ์ข้อความก่อน');navigator.vibrate&&navigator.vibrate(100);return;}a.push({t:t.value,me:true});localStorage.setItem('chat',JSON.stringify(a));show(a[a.length-1]);t.value='';toast('ส่งแล้ว ✓');navigator.vibrate&&navigator.vibrate(30);}document.body.addEventListener('click',e=>{if(e.target.tagName==='INPUT')return;send();});render();</script></body></html>
